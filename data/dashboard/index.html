    function esc(s) {
      return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function leafHtml(leaf) {
      return `<div class="node-leaf${leaf.warn ? " warn" : ""}" data-search="${esc((leaf.label+" "+leaf.meta+" "+(leaf.hint||"")).toLowerCase())}">
        <div class="label">${esc(leaf.label)}</div>
        ${leaf.meta ? `<div class="meta">${esc(leaf.meta)}</div>` : ""}
        ${leaf.hint ? `<div class="hint">${esc(leaf.hint)}</div>` : ""}
      </div>`;
    }

    function renderMindmap(map) {
      const branches = (map.branches || []).map((br) => {
        const leaves = (br.leaves || []).map(leafHtml).join("");
        return `<div class="branch-row"><div class="node-cat cat-${esc(br.color||"blue")}"><div class="label">${esc(br.label)}</div><div class="summary">${esc(br.summary||"")}</div></div><div class="leaves">${leaves}</div></div>`;
      }).join("");
      const root = map.root || {};
      return `<div class="mindmap"><div class="mindmap-inner"><svg class="mindmap-svg"></svg><div class="node-root"><div class="label">${esc(root.label||"")}</div>${root.meta?`<div class="meta">${esc(root.meta)}</div>`:""}</div><div class="branches">${branches}</div></div></div>`;
    }

    function drawConnectors(wrap) {
      const svg = wrap.querySelector(".mindmap-svg");
      const inner = wrap.querySelector(".mindmap-inner");
      const root = wrap.querySelector(".node-root");
      if (!svg || !inner || !root) return;
      const ir = inner.getBoundingClientRect();
      svg.setAttribute("width", ir.width);
      svg.setAttribute("height", ir.height);
      svg.innerHTML = "";
      function curve(x1,y1,x2,y2){ const mx=(x1+x2)/2; return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`; }
      function pt(el){ const r=el.getBoundingClientRect(); return { right:r.right-ir.left, left:r.left-ir.left, cy:r.top+r.height/2-ir.top }; }
      const rp = pt(root);
      wrap.querySelectorAll(".branch-row").forEach((row) => {
        const cat = row.querySelector(".node-cat");
        if (!cat) return;
        const cp = pt(cat);
        const p = document.createElementNS("http://www.w3.org/2000/svg","path");
        p.setAttribute("d", curve(rp.right, rp.cy, cp.left, cp.cy));
        svg.appendChild(p);
        row.querySelectorAll(".node-leaf").forEach((leaf) => {
          const lp = pt(leaf), lp2 = pt(cat);
          const p2 = document.createElementNS("http://www.w3.org/2000/svg","path");
          p2.setAttribute("d", curve(lp2.right, lp2.cy, lp.left, lp.cy));
          svg.appendChild(p2);
        });
      });

      const rows = list.map((it) => {
        const cls = it.severity === "warn" ? "warn-row" : "info-row";
        const tag = it.severity === "warn" ? '<span class="tag tag-warn">需处理</span>' : '<span class="tag tag-info">提示</span>';
        return `<tr class="${cls}" data-search="${esc((it.category+" "+it.subject+" "+it.reason+" "+it.suggestion).toLowerCase())}">
          <td>${tag} ${esc(it.category)}</td>
          <td class="col-subject">${esc(it.subject)}</td>
          <td class="col-reason">${esc(it.reason)}</td>
          <td>${esc(it.impact || "—")}</td>
          <td class="col-suggestion">${esc(it.suggestion || "—")}</td>
        </tr>`;
      }).join("");
      return `<section class="section" id="secDetail">
        <div class="section-head">不一致明细（${list.length} 条）</div>
        <div class="detail-summary">需处理 ${warnN} 条 · 提示 ${list.length - warnN} 条 · 下列为具体对象、原因与建议</div>
        <div class="detail-table-wrap"><table class="detail-table">
          <thead><tr><th>类型</th><th>对象</th><th>具体原因</th><th>影响</th><th>建议</th></tr></thead>
          <tbody id="detailBody">${rows}</tbody>
        </table></div>
      </section>`;
    }

    function renderAll() {
      const main = document.getElementById("main");
      const ov = DATA.overview;
      const gaps = DATA.gaps;
      const links = (ov.links||[]).map((lk)=>`<span>${esc(lk.from)} → ${esc(lk.to)}（${esc(lk.label)}）</span>`).join("");
      let html = `<section class="section"><div class="section-head">${esc(ov.title||"数据总览")}</div><div class="section-note">关联键：${esc(DATA.join_key||"")} · <code>${esc(DATA.db_path||"")}</code></div>${renderMindmap(ov)}<div class="link-legend">${links}</div></section>`;
      html += `<section class="section" id="secGaps"><div class="section-head">${esc(gaps.title||"缺口")}</div><div class="section-note">按类型展开，叶子节点为具体对象及原因摘要</div>${renderMindmap(gaps)}</section>`;
      html += renderInconsistencies(DATA.inconsistencies || []);
      html += `<section class="section" id="secCustomers"><div class="section-head">按客户牵连（${DATA.customers.length} 家有订单）</div><div class="section-note">每个客户向右牵连：主数据 · 订单 · 出货 · 档案 · 送货单 · 黄框=缺口</div><div class="customer-grid" id="customerGrid">`;
      DATA.customers.forEach((cm) => {
        const branch = { root: cm.root, branches: [{ id:"links", label:"牵连", color: cm.color||"orange", summary:"5 节点", leaves: cm.leaves }] };
        html += `<div class="customer-card" data-search="${esc((cm.root.label+" "+cm.root.meta).toLowerCase())}">${renderMindmap(branch)}</div>`;
      });
      html += `</div></section>`;
      main.innerHTML = html;
      document.querySelectorAll(".mindmap").forEach(drawConnectors);
    }

    function redraw(){ document.querySelectorAll(".mindmap").forEach(drawConnectors); }
    window.addEventListener("resize", redraw);
    document.getElementById("filter").addEventListener("input", (e) => {
      const q = (e.target.value||"").trim().toLowerCase();
      document.querySelectorAll(".customer-card").forEach((c) => c.classList.toggle("hidden", q && !c.dataset.search.includes(q)));
      document.querySelectorAll("#detailBody tr").forEach((tr) => tr.classList.toggle("hidden", q && !(tr.dataset.search||"").includes(q)));
    });
    document.getElementById("btnGaps").addEventListener("click", () => document.getElementById("secDetail")?.scrollIntoView({behavior:"smooth"}));
    document.getElementById("btnExpand").addEventListener("click", () => document.getElementById("secCustomers")?.scrollIntoView({behavior:"smooth"}));
    document.getElementById("btnTop").addEventListener("click", () => window.scrollTo({top:0,behavior:"smooth"}));
    renderAll();
    requestAnimationFrame(redraw);
  </script>
</body>
</html>
