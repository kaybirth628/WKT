<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WKT 数据牵连看板</title>
  <style>
    :root {
      --bg: #eceff3;
      --text: #1e293b;
      --muted: #64748b;
      --line: #b8c4d0;
      --root-bg: #f8fafc;
      --root-border: #cbd5e1;
      --leaf-bg: #1e3d4f;
      --leaf-text: #ecf4f8;
      --leaf-meta: #94b4c4;
      --cat-blue: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
      --cat-orange: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
      --cat-purple: linear-gradient(135deg, #a855f7 0%, #c084fc 100%);
      --cat-green: linear-gradient(135deg, #10b981 0%, #34d399 100%);
      --cat-red: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
      --cat-gray: linear-gradient(135deg, #64748b 0%, #94a3b8 100%);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 0.85rem 1.25rem; background: #fff; border-bottom: 1px solid #dde3ea; }
    header h1 { margin: 0 0 0.25rem; font-size: 1.1rem; }
    header p { margin: 0; font-size: 0.8rem; color: var(--muted); }
    .toolbar { padding: 0.55rem 1.25rem; background: #fff; border-bottom: 1px solid #dde3ea; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .toolbar input { flex: 1 1 200px; max-width: 320px; padding: 0.35rem 0.55rem; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
    .toolbar button { padding: 0.35rem 0.65rem; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; cursor: pointer; font: inherit; }
    main { padding: 1rem 1.25rem 2.5rem; }
    .section { margin-bottom: 2rem; background: #fff; border-radius: 12px; border: 1px solid #dde3ea; overflow: hidden; }
    .section-head { padding: 0.65rem 1rem; font-size: 0.9rem; font-weight: 600; border-bottom: 1px solid #eef2f6; background: #f8fafc; }
    .section-note { padding: 0 1rem 0.65rem; font-size: 0.75rem; color: var(--muted); background: #f8fafc; border-bottom: 1px solid #eef2f6; }
    .mindmap { position: relative; padding: 1.5rem 1rem; overflow-x: auto; }
    .mindmap-inner { position: relative; display: flex; align-items: center; min-width: max-content; min-height: 120px; }
    .mindmap-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
    .mindmap-svg path { fill: none; stroke: var(--line); stroke-width: 2; }
    .node-root { position: relative; z-index: 2; flex: 0 0 auto; min-width: 130px; max-width: 160px; padding: 0.85rem 1rem; background: var(--root-bg); border: 1px solid var(--root-border); border-radius: 10px; box-shadow: 0 2px 8px rgba(15,23,42,0.06); }
    .node-root .label { font-weight: 600; font-size: 0.92rem; }
    .node-root .meta { margin-top: 0.25rem; font-size: 0.72rem; color: var(--muted); line-height: 1.35; }
    .branches { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; gap: 1.75rem; margin-left: 4.5rem; }
    .branch-row { display: flex; align-items: center; gap: 3.5rem; }
    .node-cat { flex: 0 0 auto; min-width: 148px; padding: 0.75rem 0.9rem; border-radius: 10px; color: #fff; box-shadow: 0 3px 12px rgba(15,23,42,0.12); }
    .node-cat.cat-blue { background: var(--cat-blue); }
    .node-cat.cat-orange { background: var(--cat-orange); }
    .node-cat.cat-purple { background: var(--cat-purple); }
    .node-cat.cat-green { background: var(--cat-green); }
    .node-cat.cat-red { background: var(--cat-red); }
    .node-cat.cat-gray { background: var(--cat-gray); }
    .node-cat .label { font-weight: 600; font-size: 0.88rem; }
    .node-cat .summary { margin-top: 0.2rem; font-size: 0.72rem; opacity: 0.92; }
    .leaves { display: flex; flex-direction: column; gap: 0.65rem; }
    .node-leaf { position: relative; z-index: 2; min-width: 210px; max-width: 420px; padding: 0.55rem 0.85rem; background: var(--leaf-bg); color: var(--leaf-text); border-radius: 8px; box-shadow: 0 2px 6px rgba(15,23,42,0.15); }
    .node-leaf.warn { outline: 2px solid #fbbf24; }
    .node-leaf .label { font-weight: 600; font-size: 0.82rem; font-family: Consolas, "Courier New", monospace; }
    .node-leaf .meta { font-size: 0.78rem; color: #7dd3fc; margin-top: 0.1rem; }
    .node-leaf .hint { font-size: 0.68rem; color: var(--leaf-meta); margin-top: 0.15rem; line-height: 1.4; word-break: break-word; }
    .customer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); gap: 1rem; padding: 1rem; }
    .customer-card { border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; }
    .customer-card .mindmap { padding: 1rem 0.75rem; }
    .customer-card .branches { gap: 0; margin-left: 3rem; }
    .customer-card .branch-row { gap: 2.5rem; }
    .customer-card .node-root { min-width: 110px; max-width: 140px; padding: 0.6rem 0.75rem; }
    .customer-card .node-root .label { font-size: 0.78rem; word-break: break-all; }
    .customer-card .node-cat { min-width: 88px; padding: 0.5rem 0.65rem; }
    .customer-card .node-cat .label { font-size: 0.75rem; }
    .customer-card .leaves { flex-direction: row; flex-wrap: wrap; gap: 0.45rem; max-width: 360px; }
    .customer-card .node-leaf { min-width: 100px; padding: 0.4rem 0.55rem; }
    .customer-card .node-leaf .label { font-size: 0.7rem; }
    .customer-card .node-leaf .meta { font-size: 0.68rem; }
    .link-legend { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; padding: 0.65rem 1rem 1rem; font-size: 0.75rem; color: var(--muted); }
    .link-legend span::before { content: "→ "; color: #94a3b8; }
    .hidden { display: none !important; }
    .detail-table-wrap { padding: 0 1rem 1rem; overflow-x: auto; }
    .detail-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .detail-table th, .detail-table td { border: 1px solid #e2e8f0; padding: 0.5rem 0.6rem; text-align: left; vertical-align: top; }
    .detail-table th { background: #f8fafc; font-weight: 600; white-space: nowrap; }
    .detail-table tr.warn-row { background: #fffbeb; }
    .detail-table tr.info-row { background: #fafafa; }
    .detail-table .col-subject { min-width: 140px; max-width: 220px; word-break: break-all; font-weight: 600; }
    .detail-table .col-reason { min-width: 280px; max-width: 520px; line-height: 1.45; color: #334155; }
    .detail-table .col-suggestion { min-width: 180px; color: var(--muted); line-height: 1.4; }
    .detail-table .tag { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 999px; font-size: 0.68rem; font-weight: 600; }
    .detail-table .tag-warn { background: #fef3c7; color: #b45309; }
    .detail-table .tag-info { background: #f1f5f9; color: #64748b; }
    .detail-summary { padding: 0.5rem 1rem 0; font-size: 0.78rem; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>WKT 本地数据牵连看板</h1>
    <p>树杈思维导图 · 生成时间 __GENERATED__ · 更新：<code>python scripts/generate_data_dashboard.py</code></p>
  </header>
  <div class="toolbar">
    <input type="search" id="filter" placeholder="筛选客户名 / 表名…" />
    <button type="button" id="btnGaps">跳到不一致明细</button>
    <button type="button" id="btnExpand">跳到客户牵连</button>
    <button type="button" id="btnTop">回到顶部</button>
  </div>
  <main id="main"></main>
  <script>
    const DATA = __DATA_JSON__;

    function esc(s) {
      return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function leafHtml(leaf) {
      return `<div class="node-leaf${leaf.warn ? " warn" : ""}" data-search="${esc((leaf.label+" "+leaf.meta+" "+(leaf.hint||"")).toLowerCase())}">
        <div class="label">${esc(leaf.label)}</div>
        ${leaf.meta ? `<div class="meta">${esc(leaf.meta)}</div>` : ""}
        ${leaf.hint ? `<div class="hint">${esc(leaf.hint)}</div>` : ""}
      </div>`;
    }

    function renderMindmap(map) {
      const branches = (map.branches || []).map((br) => {
        const leaves = (br.leaves || []).map(leafHtml).join("");
        return `<div class="branch-row"><div class="node-cat cat-${esc(br.color||"blue")}"><div class="label">${esc(br.label)}</div><div class="summary">${esc(br.summary||"")}</div></div><div class="leaves">${leaves}</div></div>`;
      }).join("");
      const root = map.root || {};
      return `<div class="mindmap"><div class="mindmap-inner"><svg class="mindmap-svg"></svg><div class="node-root"><div class="label">${esc(root.label||"")}</div>${root.meta?`<div class="meta">${esc(root.meta)}</div>`:""}</div><div class="branches">${branches}</div></div></div>`;
    }

    function drawConnectors(wrap) {
      const svg = wrap.querySelector(".mindmap-svg");
      const inner = wrap.querySelector(".mindmap-inner");
      const root = wrap.querySelector(".node-root");
      if (!svg || !inner || !root) return;
      const ir = inner.getBoundingClientRect();
      svg.setAttribute("width", ir.width);
      svg.setAttribute("height", ir.height);
      svg.innerHTML = "";
      function curve(x1,y1,x2,y2){ const mx=(x1+x2)/2; return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`; }
      function pt(el){ const r=el.getBoundingClientRect(); return { right:r.right-ir.left, left:r.left-ir.left, cy:r.top+r.height/2-ir.top }; }
      const rp = pt(root);
      wrap.querySelectorAll(".branch-row").forEach((row) => {
        const cat = row.querySelector(".node-cat");
        if (!cat) return;
        const cp = pt(cat);
        const p = document.createElementNS("http://www.w3.org/2000/svg","path");
        p.setAttribute("d", curve(rp.right, rp.cy, cp.left, cp.cy));
        svg.appendChild(p);
        row.querySelectorAll(".node-leaf").forEach((leaf) => {
          const lp = pt(leaf), lp2 = pt(cat);
          const p2 = document.createElementNS("http://www.w3.org/2000/svg","path");
          p2.setAttribute("d", curve(lp2.right, lp2.cy, lp.left, lp.cy));
          svg.appendChild(p2);
        });
      });
    }

    function renderInconsistencies(list) {
      if (!list || !list.length) {
        return `<section class="section" id="secDetail"><div class="section-head">不一致明细</div><div class="detail-summary">未发现不一致项。</div></section>`;
      }
      const warnN = list.filter((x) => x.severity === "warn").length;
      const rows = list.map((it) => {
        const cls = it.severity === "warn" ? "warn-row" : "info-row";
        const tag = it.severity === "warn" ? '<span class="tag tag-warn">需处理</span>' : '<span class="tag tag-info">提示</span>';
        return `<tr class="${cls}" data-search="${esc((it.category+" "+it.subject+" "+it.reason+" "+it.suggestion).toLowerCase())}">
          <td>${tag} ${esc(it.category)}</td>
          <td class="col-subject">${esc(it.subject)}</td>
          <td class="col-reason">${esc(it.reason)}</td>
          <td>${esc(it.impact || "—")}</td>
          <td class="col-suggestion">${esc(it.suggestion || "—")}</td>
        </tr>`;
      }).join("");
      return `<section class="section" id="secDetail">
        <div class="section-head">不一致明细（${list.length} 条）</div>
        <div class="detail-summary">需处理 ${warnN} 条 · 提示 ${list.length - warnN} 条 · 下列为具体对象、原因与建议</div>
        <div class="detail-table-wrap"><table class="detail-table">
          <thead><tr><th>类型</th><th>对象</th><th>具体原因</th><th>影响</th><th>建议</th></tr></thead>
          <tbody id="detailBody">${rows}</tbody>
        </table></div>
      </section>`;
    }

    function renderAll() {
      const main = document.getElementById("main");
      const ov = DATA.overview;
      const gaps = DATA.gaps;
      const links = (ov.links||[]).map((lk)=>`<span>${esc(lk.from)} → ${esc(lk.to)}（${esc(lk.label)}）</span>`).join("");
      let html = `<section class="section"><div class="section-head">${esc(ov.title||"数据总览")}</div><div class="section-note">关联键：${esc(DATA.join_key||"")} · <code>${esc(DATA.db_path||"")}</code></div>${renderMindmap(ov)}<div class="link-legend">${links}</div></section>`;
      html += `<section class="section" id="secGaps"><div class="section-head">${esc(gaps.title||"缺口")}</div><div class="section-note">按类型展开，叶子节点为具体对象及原因摘要</div>${renderMindmap(gaps)}</section>`;
      html += renderInconsistencies(DATA.inconsistencies || []);
      html += `<section class="section" id="secCustomers"><div class="section-head">按客户牵连（${DATA.customers.length} 家有订单）</div><div class="section-note">每个客户向右牵连：主数据 · 订单 · 出货 · 档案 · 送货单 · 黄框=缺口</div><div class="customer-grid" id="customerGrid">`;
      DATA.customers.forEach((cm) => {
        const branch = { root: cm.root, branches: [{ id:"links", label:"牵连", color: cm.color||"orange", summary:"5 节点", leaves: cm.leaves }] };
        html += `<div class="customer-card" data-search="${esc((cm.root.label+" "+cm.root.meta).toLowerCase())}">${renderMindmap(branch)}</div>`;
      });
      html += `</div></section>`;
      main.innerHTML = html;
      document.querySelectorAll(".mindmap").forEach(drawConnectors);
    }

    function redraw(){ document.querySelectorAll(".mindmap").forEach(drawConnectors); }
    window.addEventListener("resize", redraw);
    document.getElementById("filter").addEventListener("input", (e) => {
      const q = (e.target.value||"").trim().toLowerCase();
      document.querySelectorAll(".customer-card").forEach((c) => c.classList.toggle("hidden", q && !c.dataset.search.includes(q)));
      document.querySelectorAll("#detailBody tr").forEach((tr) => tr.classList.toggle("hidden", q && !(tr.dataset.search||"").includes(q)));
    });
    document.getElementById("btnGaps").addEventListener("click", () => document.getElementById("secDetail")?.scrollIntoView({behavior:"smooth"}));
    document.getElementById("btnExpand").addEventListener("click", () => document.getElementById("secCustomers")?.scrollIntoView({behavior:"smooth"}));
    document.getElementById("btnTop").addEventListener("click", () => window.scrollTo({top:0,behavior:"smooth"}));
    renderAll();
    requestAnimationFrame(redraw);
  </script>
</body>
</html>
