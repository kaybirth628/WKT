<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WKT 销售管理系统 · 工序库存</title>
  {% include '_theme_head.html' %}
  <link rel="stylesheet" href="/static/style.css?v=20260722-compact" />
  <link rel="stylesheet" href="/static/cost.css?v=20260722-compact" />
  <link rel="stylesheet" href="/static/inventory.css?v=20260729-inv-board" />
</head>
<body>
  <div class="app-layout">
    {% include '_order_sidebar.html' %}
    <div class="app-main">
      <main class="content-stack cost-stack">
        <h3 class="section-h3 submodule-page-title">工序库存</h3>
        <section class="card list-card inv-entry-card">
          <form id="invLoadForm" class="filter-bar filter-bar-compact">
            <label class="cost-filter-field inv-bom-field">
              <span>产品料号</span>
              <input name="product_part_no" type="text" placeholder="BOM 料号" autocomplete="off" />
            </label>
            <label class="cost-filter-field inv-bom-field">
              <span>产品名称</span>
              <input name="product_name" type="text" placeholder="BOM 品名" autocomplete="off" />
            </label>
            <label class="cost-filter-field inv-bom-field">
              <span>客户名称</span>
              <input name="customer_name" type="text" placeholder="模糊匹配" autocomplete="off" />
            </label>
            <button type="submit" class="btn btn-primary btn-sm">载入工序库存</button>
          </form>
          <p id="invEntryMsg" class="msg list-msg"></p>

          <div id="invStationHost" class="inv-board inv-station-board" hidden></div>

          <h4 class="inv-section-title" id="invMovementTitle">工序流动记录</h4>
          <div class="list-scroll-host">
            <div class="table-wrap list-table-wrap">
              <table class="data-table list-table">
                <thead>
                  <tr class="list-header-row">
                    <th class="list-th-text">时间</th>
                    <th class="list-th-text">客户名称</th>
                    <th class="list-th-text">客户料号</th>
                    <th class="list-th-text">产品名称</th>
                    <th>动作</th>
                    <th>工序</th>
                    <th>数量</th>
                    <th class="list-th-text">单号</th>
                    <th class="list-th-text">备注</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="invEntryMovementBody">
                  <tr><td colspan="10" class="list-td-text">加载中…</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
      <footer class="page-footer">
        <h2 class="page-title">库存 · 工序库存</h2>
        <p class="page-desc">点选工序（最多 2 道）后编辑；下方为流动记录</p>
      </footer>
    </div>
  </div>
  <script src="/static/inventory_bom_lookup.js?v=20260725-inv-autocomplete"></script>
  <script src="/static/inventory_entry.js?v=20260729-inv-simplify"></script>
</body>
</html>
