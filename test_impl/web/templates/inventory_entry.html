<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WKT 销售管理系统 · 工序出入库</title>
  {% include '_theme_head.html' %}
  <link rel="stylesheet" href="/static/style.css?v=20260722-compact" />
  <link rel="stylesheet" href="/static/cost.css?v=20260722-compact" />
  <link rel="stylesheet" href="/static/inventory.css?v=20260725-inv-in-out" />
</head>
<body>
  <div class="app-layout">
    {% include '_order_sidebar.html' %}
    <div class="app-main">
      <main class="content-stack cost-stack">
        <h3 class="section-h3 submodule-page-title">工序出入库</h3>
        <section class="card list-card inv-entry-card">
          <form id="invLoadForm" class="filter-bar filter-bar-compact">
            <label class="cost-filter-field inv-bom-field">
              <span>产品料号</span>
              <input name="product_part_no" type="text" placeholder="BOM 料号" autocomplete="off" />
            </label>
            <label class="cost-filter-field inv-bom-field">
              <span>产品名称</span>
              <input name="product_name" type="text" placeholder="BOM 品名" autocomplete="off" />
            </label>
            <label class="cost-filter-field inv-bom-field">
              <span>客户名称</span>
              <input name="customer_name" type="text" placeholder="模糊匹配" autocomplete="off" />
            </label>
            <button type="submit" class="btn btn-primary btn-sm">载入工序库存</button>
          </form>
          <p id="invEntryMsg" class="msg list-msg"></p>

          <div id="invStationHost" class="inv-board inv-station-board" hidden></div>

          <div id="invActionPanel" class="inv-action-panel" hidden>
            <h4 class="inv-section-title">登记动作</h4>
            <div id="invActionBtns" class="inv-action-btns"></div>
            <form id="invSubmitForm" class="inv-submit-row">
              <input type="hidden" name="action_type" id="invActionType" />
              <input type="hidden" name="process_code" id="invProcessCode" />
              <label class="field inv-inline-field" id="invInboundField" hidden>
                <span>入库工序</span>
                <select id="invInboundProcess" name="inbound_process_code"></select>
              </label>
              <label class="field inv-inline-field" id="invOutboundFromField" hidden>
                <span>从工序</span>
                <select id="invOutboundFrom" name="from_process_code"></select>
              </label>
              <label class="field inv-inline-field" id="invOutboundToField" hidden>
                <span>到工序</span>
                <select id="invOutboundTo" name="to_process_code"></select>
              </label>
              <label class="field inv-inline-field" id="invSupplierField" hidden>
                <span>供应商</span>
                <input type="hidden" name="supplier_name" id="invSupplierHidden" value="" />
                <input type="text" id="invSupplierBom" class="inv-supplier-bom" readonly hidden />
                <select id="invSupplierSelect" class="inv-supplier-select" hidden></select>
              </label>
              <label class="field inv-inline-field" id="invAdjustScopeField" hidden>
                <span>校正对象</span>
                <select id="invAdjustScope" name="adjust_scope">
                  <option value="inhouse">场内</option>
                  <option value="outsource">在途</option>
                </select>
              </label>
              <label class="field inv-inline-field" id="invQtyField">
                <span id="invQtyLabel">数量 (PCS)</span>
                <input name="qty" type="number" step="0.1" min="0.1" required />
              </label>
              <label class="field inv-inline-field inv-inline-optional">
                <span>备注</span>
                <input name="note" placeholder="可选" />
              </label>
              <div class="inv-submit-btn-wrap">
                <button type="submit" class="btn btn-primary" id="invSubmitBtn">提交登记</button>
              </div>
            </form>
            <div id="invEntrySuccess" class="inv-entry-success" hidden aria-live="polite">
              <span class="inv-entry-success-icon" aria-hidden="true">✓</span>
              <strong class="inv-entry-success-title">已录入</strong>
              <span id="invEntrySuccessDetail" class="inv-entry-success-detail"></span>
            </div>
          </div>

          <h4 class="inv-section-title">当日出入库流水</h4>
          <div class="list-scroll-host">
            <div class="table-wrap list-table-wrap">
              <table class="data-table list-table">
                <thead>
                  <tr class="list-header-row">
                    <th class="list-th-text">时间</th>
                    <th class="list-th-text">客户名称</th>
                    <th class="list-th-text">客户料号</th>
                    <th class="list-th-text">产品名称</th>
                    <th>动作</th>
                    <th>工序</th>
                    <th>数量</th>
                    <th class="list-th-text">单号</th>
                    <th class="list-th-text">备注</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="invEntryMovementBody">
                  <tr><td colspan="10" class="list-td-text">加载中…</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
      <footer class="page-footer">
        <h2 class="page-title">库存 · 工序出入库</h2>
        <p class="page-desc">入库 / 出库登记；场内↔在途按 BOM 工艺顺序扣增</p>
      </footer>
    </div>
  </div>
  <script src="/static/inventory_bom_lookup.js?v=20260725-inv-autocomplete"></script>
  <script src="/static/inventory_entry.js?v=20260725-inv-station-sync"></script>
</body>
</html>
