<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WKT 销售管理系统 · BOM录入</title>
  {% include '_theme_head.html' %}
  <link rel="stylesheet" href="/static/style.css?v=20260711-title-gray-bg" />
  <link rel="stylesheet" href="/static/cost.css?v=20260729-bom-dup-highlight" />
</head>
<body>
  <div class="app-layout">
    {% include '_order_sidebar.html' %}

    <div class="app-main">
      <main class="content-stack cost-stack">
        <h3 class="section-h3 submodule-page-title">BOM录入</h3>

        <section class="card mode-card">
          <div class="mode-switch" role="tablist" aria-label="BOM 录入方式">
            <button type="button" class="mode-btn" id="bomModeBatchBtn" data-mode="batch" role="tab" aria-selected="false">Excel 批量导入</button>
            <button type="button" class="mode-btn" id="bomModeManualBtn" data-mode="manual" role="tab" aria-selected="false">手动录入</button>
          </div>
          <p id="bomModeHint" class="mode-hint">请先选择录入方式</p>
        </section>

        <div id="bomBatchPanel" class="mode-panel is-hidden">
          <section class="card upload-card">
            <div class="upload-row">
              <input type="file" id="bomImportFile" accept=".xlsx,.xlsm,.xls" />
              <button type="button" id="bomImportParseBtn" class="btn btn-primary">解析预览</button>
            </div>
            <p id="bomImportMsg" class="msg"></p>
            <div id="bomImportSuccess" class="bom-import-success is-hidden" aria-live="polite"></div>
          </section>

          <section id="bomImportPreviewArea" class="card preview-card list-card is-hidden">
            <div class="bom-import-batch-customer">
              <label class="bom-import-batch-label">
                <span>统一客户</span>
                <input
                  type="text"
                  id="bomImportBatchCustomer"
                  placeholder="客商全称"
                  autocomplete="off"
                />
              </label>
              <button type="button" id="bomImportApplyAllBtn" class="btn btn-outline btn-sm">应用到全部</button>
              <button type="button" id="bomImportApplyBlockedBtn" class="btn btn-outline btn-sm">应用到阻断/待核</button>
            </div>
            <div class="card-head excel-preview-toolbar bom-preview-toolbar">
              <h3>导入预览</h3>
              <div id="bomImportStats" class="bom-import-stats"></div>
            </div>
            <div id="bomImportResult" class="bom-import-result is-hidden" aria-live="polite"></div>
            <div class="table-wrap list-table-wrap bom-import-table-wrap" tabindex="0" aria-label="BOM 导入预览表格">
              <table class="data-table list-table bom-import-table">
                <colgroup>
                  <col style="width:9%" />
                  <col style="width:16%" />
                  <col style="width:13%" />
                  <col style="width:14%" />
                  <col style="width:7%" />
                  <col style="width:18%" />
                  <col style="width:7%" />
                  <col style="width:16%" />
                </colgroup>
                <thead>
                  <tr class="list-header-row">
                    <th scope="col">Sheet</th>
                    <th scope="col" class="list-th-text">客户</th>
                    <th scope="col" class="list-th-text">产品料号</th>
                    <th scope="col" class="list-th-text">产品名称</th>
                    <th scope="col">单重(g)</th>
                    <th scope="col" class="list-th-text">制程</th>
                    <th scope="col">状态</th>
                    <th scope="col" class="list-th-text">说明</th>
                  </tr>
                </thead>
                <tbody id="bomImportBody"></tbody>
              </table>
            </div>
            <div class="bom-import-footer">
              <button type="button" id="bomImportUploadBtn" class="btn btn-primary" disabled>批量上传</button>
            </div>
          </section>
        </div>

        <div id="bomManualPanel" class="mode-panel is-hidden">
          <section class="card list-card cost-form-card">
            <form id="costEntryForm" class="form">
              <div class="cost-header-table">
                <div class="cost-header-row">
                  <label class="field">
                    <span>客户名称</span>
                    <input name="customer_name" id="customerNameInput" list="customerOptions" required placeholder="如：凯泰" />
                    <datalist id="customerOptions"></datalist>
                  </label>
                  <label class="field">
                    <span>产品名称</span>
                    <input name="product_name" required placeholder="如：PL9-01050-00-0A-前挡板" />
                  </label>
                  <label class="field">
                    <span>模具编号</span>
                    <input name="mold_no" required placeholder="如：WKT-MJ-LV-24027" />
                  </label>
                  <label class="field field--part-no">
                    <span>产品料号</span>
                    <input
                      name="product_part_no"
                      id="productPartNoInput"
                      list="partNoOptions"
                      required
                      placeholder="如：PL9-01050-00-0A"
                      autocomplete="off"
                    />
                    <datalist id="partNoOptions"></datalist>
                    <p id="partLookupHint" class="field-hint" hidden></p>
                  </label>
                  <label class="field">
                    <span>模穴</span>
                    <input name="cavity" required placeholder="如：1*2" />
                  </label>
                </div>
                <div class="cost-header-row">
                  <label class="field">
                    <span>产品单重 (g)</span>
                    <input name="unit_weight_g" type="number" step="0.01" min="0" required placeholder="如：88" />
                  </label>
                  <label class="field">
                    <span>材质</span>
                    <input name="material" list="materialOptions" required placeholder="如：ADC12" />
                    <datalist id="materialOptions"></datalist>
                  </label>
                  <label class="field">
                    <span>机台吨位</span>
                    <input name="machine_tonnage" required placeholder="如：280T" />
                  </label>
                  <label class="field">
                    <span>原材单价</span>
                    <input name="material_unit_price" type="number" step="0.0001" min="0" value="0" />
                  </label>
                </div>
              </div>

              <div class="items-block">
                <div class="items-head">
                  <h4>工序选择</h4>
                </div>
                <div id="processGrid" class="process-grid process-pick-grid"></div>
                <div id="processOrderBlock" class="process-order-block" hidden>
                  <div class="items-head">
                    <h5>工艺顺序</h5>
                  </div>
                  <ol id="processOrderList" class="process-order-list"></ol>
                </div>
              </div>

              <div class="form-actions cost-entry-actions">
                <button type="button" id="previewBtn" class="btn btn-secondary">预览成本</button>
                <button type="submit" class="btn btn-primary">提交保存</button>
                <p id="costMsg" class="msg"></p>
              </div>
            </form>
          </section>
        </div>
      </main>

      <footer class="page-footer">
        <h2 class="page-title">BOM信息 · BOM录入</h2>
        <p class="page-desc">支持 Excel 批量导入、手动录入</p>
      </footer>
    </div>
  </div>

  <div id="costPreviewModal" class="cost-modal" hidden>
    <div class="cost-modal-panel" role="dialog" aria-modal="true" aria-labelledby="costPreviewTitle">
      <div class="cost-modal-head">
        <h3 id="costPreviewTitle">成本预览</h3>
        <button type="button" id="costPreviewClose" class="btn btn-ghost">关闭</button>
      </div>
      <div id="previewBody" class="cost-modal-body"></div>
    </div>
  </div>

  <script src="/static/cost_common.js?v=20260728-bom-clean-entry"></script>
  <script src="/static/cost_bom_import.js?v=20260729-bom-dup-highlight"></script>
  <script src="/static/cost_entry.js?v=20260728-bom-clean-entry"></script>
</body>
</html>
