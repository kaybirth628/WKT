<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WKT 销售管理系统 · BOM查询</title>
  {% include '_theme_head.html' %}
  <link rel="stylesheet" href="/static/style.css?v=20260729-form-input-unify" />
  <link rel="stylesheet" href="/static/cost.css?v=20260729-bom-query-preview" />
</head>
<body>
  <div class="app-layout">
    {% include '_order_sidebar.html' %}

    <div class="app-main">
      <main class="content-stack cost-stack">
        <h3 class="section-h3 submodule-page-title">BOM查询</h3>
        <section class="card list-card" id="costQuerySection">
          <form id="costQueryForm" class="filter-bar filter-bar-compact">
            <label class="cost-filter-field inv-bom-field">
              <span>关键字</span>
              <input name="q" type="text" placeholder="客户 / 产品 / 料号 / 模具 / 材质" autocomplete="off" />
            </label>
            <label class="cost-filter-field inv-bom-field">
              <span>客户名称</span>
              <input name="customer" type="text" placeholder="模糊匹配" autocomplete="off" />
            </label>
            <label class="cost-filter-field inv-bom-field">
              <span>产品料号</span>
              <input name="product_part_no" type="text" placeholder="模糊匹配" autocomplete="off" />
            </label>
            <button type="submit" class="btn btn-primary btn-sm">查询</button>
            <button type="button" id="costQueryReset" class="btn btn-outline btn-sm">重置</button>
          </form>

          <div class="list-meta-row">
            <button type="button" id="costQueryClearColFilters" class="btn btn-outline btn-sm">清空列筛选</button>
            <p id="costQueryCount" class="list-summary">共 0 条</p>
          </div>

          <div id="costQueryColFilterPanel" class="list-col-filter-panel is-hidden" role="dialog" aria-modal="true" aria-labelledby="costQueryColFilterPanelTitle">
            <div class="list-col-filter-panel-head">
              <span id="costQueryColFilterPanelTitle">筛选</span>
              <button type="button" class="list-col-filter-close" id="costQueryColFilterPanelClose" aria-label="关闭">×</button>
            </div>
            <input type="text" class="list-col-filter-search" id="costQueryColFilterSearch" placeholder="搜索选项…" />
            <label class="list-col-filter-all"><input type="checkbox" id="costQueryColFilterSelectAll" checked /> <span id="costQueryColFilterSelectAllLabel">全选</span></label>
            <div id="costQueryColFilterOptions" class="list-col-filter-options"></div>
            <div class="list-col-filter-actions">
              <button type="button" class="btn btn-primary btn-sm" id="costQueryColFilterApply">确定</button>
              <button type="button" class="btn btn-outline btn-sm" id="costQueryColFilterReset">重置</button>
            </div>
          </div>

          <div class="list-scroll-host">
            <div class="table-wrap list-table-wrap" tabindex="0" aria-label="BOM 查询表格">
              <table class="data-table list-table cost-query-table">
                <colgroup>
                  <col style="width:3%" />
                  <col style="width:12%" />
                  <col style="width:17%" />
                  <col style="width:12%" />
                  <col style="width:8%" />
                  <col style="width:7%" />
                  <col style="width:7%" />
                  <col style="width:6%" />
                  <col style="width:9%" />
                  <col style="width:12%" />
                  <col style="width:7%" />
                </colgroup>
                <thead id="costQueryHead">
                  <tr class="list-header-row">
                    <th scope="col" class="list-th-seq">序号</th>
                    <th scope="col" class="list-th-filterable list-th-text"><span class="list-th-inner"><span class="list-th-label">客户</span><button type="button" class="list-filter-btn" data-col="customer_name" aria-label="筛选客户"><span aria-hidden="true">▾</span></button></span></th>
                    <th scope="col" class="list-th-filterable list-th-text"><span class="list-th-inner"><span class="list-th-label">产品名称</span><button type="button" class="list-filter-btn" data-col="product_name" aria-label="筛选产品名称"><span aria-hidden="true">▾</span></button></span></th>
                    <th scope="col" class="list-th-filterable list-th-text"><span class="list-th-inner"><span class="list-th-label">产品料号</span><button type="button" class="list-filter-btn" data-col="product_part_no" aria-label="筛选产品料号"><span aria-hidden="true">▾</span></button></span></th>
                    <th scope="col" class="list-th-filterable"><span class="list-th-inner"><span class="list-th-label">材质</span><button type="button" class="list-filter-btn" data-col="material" aria-label="筛选材质"><span aria-hidden="true">▾</span></button></span></th>
                    <th scope="col" class="list-th-filterable"><span class="list-th-inner"><span class="list-th-label">单重(g)</span><button type="button" class="list-filter-btn" data-col="unit_weight_g" aria-label="筛选单重"><span aria-hidden="true">▾</span></button></span></th>
                    <th scope="col" class="list-th-filterable"><span class="list-th-inner"><span class="list-th-label">机台</span><button type="button" class="list-filter-btn" data-col="machine_tonnage" aria-label="筛选机台"><span aria-hidden="true">▾</span></button></span></th>
                    <th scope="col" class="list-th-filterable"><span class="list-th-inner"><span class="list-th-label">工序数</span><button type="button" class="list-filter-btn" data-col="process_count" aria-label="筛选工序数"><span aria-hidden="true">▾</span></button></span></th>
                    <th scope="col" class="list-th-filterable"><span class="list-th-inner"><span class="list-th-label">单件成本</span><button type="button" class="list-filter-btn" data-col="unit_cost" aria-label="筛选单件成本"><span aria-hidden="true">▾</span></button></span></th>
                    <th scope="col" class="list-th-filterable"><span class="list-th-inner"><span class="list-th-label">更新时间</span><button type="button" class="list-filter-btn" data-col="updated_at" aria-label="筛选更新时间"><span aria-hidden="true">▾</span></button></span></th>
                    <th scope="col" class="list-th-action action-cell">操作</th>
                  </tr>
                </thead>
                <tbody id="costQueryBody"></tbody>
              </table>
            </div>
          </div>
          <p id="costQueryEmpty" class="empty-hint list-empty-hint" hidden>暂无记录，请先在「BOM录入」中保存</p>
        </section>
      </main>

      <footer class="page-footer">
        <h2 class="page-title">BOM信息 · BOM查询</h2>
        <p class="page-desc">检索、修改与删除 BOM 主数据记录</p>
      </footer>
    </div>
  </div>

  <div id="costDetailModal" class="cost-modal" hidden>
    <div class="cost-modal-panel cost-edit-panel" role="dialog" aria-modal="true" aria-labelledby="costDetailTitle">
      <div class="cost-modal-head">
        <h3 id="costDetailTitle">成本详情</h3>
        <div class="cost-modal-actions">
          <button type="button" id="costDetailEdit" class="btn btn-secondary btn-sm">修改</button>
          <button type="button" id="costDetailDelete" class="btn btn-danger btn-sm">删除</button>
          <button type="button" id="costDetailClose" class="btn btn-ghost btn-sm">关闭</button>
        </div>
      </div>
      <div id="costDetailBody" class="cost-modal-body"></div>
    </div>
  </div>

  <div id="costEditModal" class="cost-modal" hidden>
    <div class="cost-modal-panel cost-edit-panel" role="dialog" aria-modal="true" aria-labelledby="costEditTitle">
      <div class="cost-modal-head">
        <h3 id="costEditTitle">修改成本记录</h3>
        <button type="button" id="costEditClose" class="btn btn-ghost btn-sm">关闭</button>
      </div>
      <form id="costEditForm" class="form cost-modal-body cost-entry-layout">
        <div class="cost-header-table">
          <div class="cost-header-row">
            <label class="field">
              <span>客户名称</span>
              <input name="customer_name" required autocomplete="off" />
            </label>
            <label class="field">
              <span>产品名称</span>
              <input name="product_name" required autocomplete="off" />
            </label>
            <label class="field">
              <span>模具编号</span>
              <input name="mold_no" required />
            </label>
            <label class="field">
              <span>产品料号</span>
              <input name="product_part_no" required autocomplete="off" />
            </label>
          </div>
          <div class="cost-header-row">
            <label class="field">
              <span>模穴</span>
              <input name="cavity" required />
            </label>
            <label class="field">
              <span>产品单重 (g)</span>
              <input name="unit_weight_g" type="number" step="0.01" min="0" required />
            </label>
            <label class="field">
              <span>材质</span>
              <input name="material" required autocomplete="off" />
            </label>
            <label class="field">
              <span>机台吨位</span>
              <input name="machine_tonnage" required />
            </label>
          </div>
          <div class="cost-header-row cost-header-row--calc">
            <label class="field">
              <span>原材单价</span>
              <input name="material_unit_price" type="number" step="0.0001" min="0" value="0" />
            </label>
          </div>
        </div>
        <div class="items-block">
          <div class="items-head">
            <h4>工序选择</h4>
            <p class="items-subhint">先勾选本料号适用的工序（仅打钩）</p>
          </div>
          <div id="editProcessGrid" class="process-grid process-pick-grid process-pick-only-grid"></div>
        </div>
        <div id="editProcessDetailBlock" class="items-block process-detail-block" hidden>
          <div class="items-head">
            <h4>单价与供应商</h4>
            <p class="items-subhint">在下方为已选外发工序填写单价并添加供应商</p>
          </div>
          <div id="editProcessDetailPanel" class="process-detail-panel"></div>
        </div>
        <div id="editProcessOrderBlock" class="process-order-block items-block" hidden>
          <div class="items-head">
            <h5>工艺顺序</h5>
            <p class="card-desc">已选工序的执行顺序，可用 ↑↓ 调整</p>
          </div>
          <ol id="editProcessOrderList" class="process-order-list"></ol>
        </div>
        <div class="cost-edit-form-actions">
          <button type="submit" class="btn btn-primary">保存修改</button>
          <button type="button" id="costEditCancel" class="btn btn-secondary">取消</button>
          <p id="costEditMsg" class="msg"></p>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/hover_tip.js?v=20260729-hover-tip-copy"></script>
  <script src="/static/inventory_bom_lookup.js?v=20260729-bom-supplier-combo"></script>
  <script src="/static/list-col-filter.js?v=20260725-bom-query-seq"></script>
  <script src="/static/cost_common.js?v=20260729-bom-query-preview"></script>
  <script src="/static/cost_query.js?v=20260729-bom-query-preview"></script>
</body>
</html>
