<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WKT 销售管理系统 · 登录</title>
  {% include '_theme_head.html' %}
  <link rel="stylesheet" href="/static/style.css?v=20260723-auth" />
  <link rel="stylesheet" href="/static/auth.css?v=20260723-auth" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="auth-brand">
      <div class="logo">WKT</div>
      <h1>销售管理系统</h1>
      <p class="auth-sub">请使用分配的账号登录</p>
    </div>
    <form id="loginForm" class="auth-form" autocomplete="on">
      <label class="field">
        <span>用户名</span>
        <input type="text" id="loginUsername" name="username" required autofocus />
      </label>
      <label class="field">
        <span>密码</span>
        <input type="password" id="loginPassword" name="password" required />
      </label>
      <p id="loginMsg" class="msg auth-msg" aria-live="polite"></p>
      <button type="submit" class="btn btn-primary auth-submit">登录</button>
    </form>
    <p class="auth-foot">首次部署默认管理员：<code>admin</code> / <code>WKT@2026</code>（登录后请修改密码）</p>
  </main>
  <script src="/static/auth.js?v=20260723-auth"></script>
</body>
</html>
